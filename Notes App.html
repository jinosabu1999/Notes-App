<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Velvet Notes</title>
    
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Modern Palette - Slate & Indigo */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.2);
            --danger: #ef4444;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Dark Mode Override */
        .dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #818cf8;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-bottom: 90px; /* Space for Bottom Nav */
        }

        /* --- Header --- */
        header {
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg-body);
            transition: background 0.3s;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .theme-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }
        .theme-btn:hover { background: var(--border); }

        /* --- Search Bar --- */
        .search-wrapper {
            max-width: 800px;
            margin: 0 auto 20px auto;
            padding: 0 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px; /* Prevents iOS zoom */
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* --- Notes Layout (Masonry-ish) --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        @media (min-width: 600px) {
            .notes-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
        }

        /* --- Note Card --- */
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        /* Card Colors (Pastel) */
        .card[data-color="default"] { background: var(--bg-card); }
        .card[data-color="rose"] { background: #ffe4e6; border-color: #fecdd3; color: #881337; }
        .card[data-color="blue"] { background: #dbeafe; border-color: #bfdbfe; color: #1e3a8a; }
        .card[data-color="green"] { background: #dcfce7; border-color: #bbf7d0; color: #14532d; }
        .card[data-color="yellow"] { background: #fef9c3; border-color: #fde047; color: #713f12; }
        
        /* Dark Mode Adjustments for Colors */
        .dark-mode .card[data-color="rose"] { background: #4c0519; border-color: #881337; color: #ffe4e6; }
        .dark-mode .card[data-color="blue"] { background: #172554; border-color: #1e3a8a; color: #dbeafe; }
        .dark-mode .card[data-color="green"] { background: #052e16; border-color: #14532d; color: #dcfce7; }
        .dark-mode .card[data-color="yellow"] { background: #422006; border-color: #713f12; color: #fef9c3; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-date {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        /* Heart Icon */
        .fav-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #cbd5e1;
            transition: 0.2s;
            padding: 5px;
            margin: -5px; /* Increase touch target */
        }
        .fav-btn.active { color: #ef4444; transform: scale(1.1); }
        .fav-btn:hover { color: #ef4444; }

        .card-body {
            font-size: 15px;
            line-height: 1.5;
            max-height: 150px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
        }

        .card-tags {
            margin-top: auto;
            padding-top: 10px;
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.05);
            color: inherit;
        }

        /* --- Floating Action Button (FAB) --- */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 90;
        }
        .fab:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(99, 102, 241, 0.5); }
        .fab:active { transform: scale(0.95); }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px; /* Safe area for iOS home bar */
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            width: 60px;
            transition: 0.2s;
        }

        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        
        .nav-item.active { color: var(--accent); }
        .nav-item.active i { transform: translateY(-2px); }

        /* --- Full Screen Editor Modal --- */
        .modal {
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .modal.open { transform: translateY(0); }

        .modal-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg-body);
        }

        .btn-text {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel { color: var(--text-secondary); }
        .btn-save { color: var(--accent); }

        .editor-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-title {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Playfair Display', serif;
            outline: none;
        }

        .input-body {
            width: 100%;
            flex: 1;
            border: none;
            background: transparent;
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
        }

        .editor-tools {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            display: flex;
            gap: 15px;
            align-items: center;
            padding-bottom: 25px; /* iOS safe area */
        }

        .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent;
            position: relative;
        }
        .color-dot.selected::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: rgba(0,0,0,0.5);
            font-size: 12px;
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state i { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1 id="pageTitle">My Notes</h1>
            <button class="theme-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <div class="search-wrapper">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="filterNotes()">
        </div>
    </div>

    <div class="container">
        <div class="notes-grid" id="notesGrid">
            <!-- Notes injected here -->
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openEditor()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('all', this)">
            <i class="fas fa-layer-group"></i>
            <span>All</span>
        </button>
        <button class="nav-item" onclick="switchTab('favorites', this)">
            <i class="fas fa-heart"></i>
            <span>Favorites</span>
        </button>
        <button class="nav-item" onclick="switchTab('work', this)">
            <i class="fas fa-briefcase"></i>
            <span>Work</span>
        </button>
        <button class="nav-item" onclick="switchTab('personal', this)">
            <i class="fas fa-user"></i>
            <span>Personal</span>
        </button>
    </nav>

    <!-- Full Screen Editor -->
    <div class="modal" id="editorModal">
        <div class="modal-header">
            <button class="btn-text btn-cancel" onclick="closeEditor()">Cancel</button>
            <span style="font-weight: 600; font-size: 14px; opacity: 0.5;">Writing...</span>
            <button class="btn-text btn-save" onclick="saveNote()">Done</button>
        </div>
        <div class="editor-content">
            <input type="text" class="input-title" id="noteTag" placeholder="Title / Tag (e.g. Ideas)">
            <textarea class="input-body" id="noteText" placeholder="Start writing here..."></textarea>
        </div>
        <div class="editor-tools">
            <div class="color-dot selected" style="background: #f1f5f9; border: 1px solid #cbd5e1;" data-value="default" onclick="selectColor(this)"></div>
            <div class="color-dot" style="background: #fecdd3;" data-value="rose" onclick="selectColor(this)"></div>
            <div class="color-dot" style="background: #bfdbfe;" data-value="blue" onclick="selectColor(this)"></div>
            <div class="color-dot" style="background: #bbf7d0;" data-value="green" onclick="selectColor(this)"></div>
            <div class="color-dot" style="background: #fde047;" data-value="yellow" onclick="selectColor(this)"></div>
            
            <div style="margin-left: auto;">
                 <button class="btn-text" id="deleteBtn" style="color: var(--danger); display: none;" onclick="deleteCurrentNote()">
                    <i class="fas fa-trash"></i>
                 </button>
            </div>
        </div>
    </div>

    <script>
        // --- Data & State ---
        let notes = JSON.parse(localStorage.getItem('velvet_notes')) || [];
        let currentTab = 'all';
        let editingId = null;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            renderNotes();
        });

        // --- Core Logic ---

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            // Filter Logic
            const filtered = notes.filter(note => {
                const matchesSearch = note.text.toLowerCase().includes(search) || note.tag.toLowerCase().includes(search);
                if (!matchesSearch) return false;

                if (currentTab === 'all') return true;
                if (currentTab === 'favorites') return note.isFavorite;
                if (currentTab === 'work') return note.tag.toLowerCase().includes('work');
                if (currentTab === 'personal') return note.tag.toLowerCase().includes('personal');
                
                return true;
            });

            // Sorting: Favorites first, then newest
            filtered.sort((a, b) => {
                if (a.isFavorite === b.isFavorite) {
                    return new Date(b.date) - new Date(a.date);
                }
                return a.isFavorite ? -1 : 1;
            });

            // Empty State
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-feather"></i>
                        <p>No notes found in ${currentTab}.</p>
                    </div>`;
                return;
            }

            // Render Cards
            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.color = note.color || 'default';
                
                // Add click event to open editor
                card.onclick = (e) => {
                    // Prevent opening editor if clicking the favorite button
                    if(e.target.closest('.fav-btn')) return;
                    openEditor(note.id);
                };

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-date">${formatDate(note.date)}</span>
                        <button class="fav-btn ${note.isFavorite ? 'active' : ''}" onclick="toggleFavorite('${note.id}', this)">
                            <i class="${note.isFavorite ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        ${escapeHtml(note.text)}
                    </div>
                    <div class="card-tags">
                        <span class="tag">#${escapeHtml(note.tag || 'Untitled')}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- CRUD Operations ---

        function saveNote() {
            const text = document.getElementById('noteText').value.trim();
            const tag = document.getElementById('noteTag').value.trim();
            const color = document.querySelector('.color-dot.selected').dataset.value;

            if (!text && !tag) {
                closeEditor();
                return;
            }

            if (editingId) {
                // Update
                const index = notes.findIndex(n => n.id === editingId);
                if (index > -1) {
                    notes[index] = { ...notes[index], text, tag, color, date: new Date().toISOString() };
                }
            } else {
                // Create
                const newNote = {
                    id: Date.now().toString(),
                    text: text || "Empty Note",
                    tag: tag || "General",
                    color: color,
                    date: new Date().toISOString(),
                    isFavorite: false
                };
                notes.push(newNote);
            }

            saveToStorage();
            closeEditor();
            renderNotes();
        }

        function toggleFavorite(id, btn) {
            const note = notes.find(n => n.id === id);
            if (note) {
                note.isFavorite = !note.isFavorite;
                saveToStorage();
                
                // Instant UI Feedback
                if (note.isFavorite) {
                    btn.classList.add('active');
                    btn.querySelector('i').classList.replace('far', 'fas');
                } else {
                    btn.classList.remove('active');
                    btn.querySelector('i').classList.replace('fas', 'far');
                }

                // Re-render if in Favorites tab to remove it from view
                if (currentTab === 'favorites') {
                    setTimeout(renderNotes, 300);
                }
            }
        }

        function deleteCurrentNote() {
            if (editingId && confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== editingId);
                saveToStorage();
                closeEditor();
                renderNotes();
            }
        }

        // --- Editor Logic ---

        function openEditor(id = null) {
            const modal = document.getElementById('editorModal');
            const titleInput = document.getElementById('noteTag');
            const bodyInput = document.getElementById('noteText');
            const deleteBtn = document.getElementById('deleteBtn');

            editingId = id;
            
            // Reset Colors
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));

            if (id) {
                const note = notes.find(n => n.id === id);
                titleInput.value = note.tag;
                bodyInput.value = note.text;
                deleteBtn.style.display = 'block';
                
                // Set color
                const colorDot = document.querySelector(`.color-dot[data-value="${note.color}"]`);
                if(colorDot) colorDot.classList.add('selected');
                else document.querySelector('.color-dot[data-value="default"]').classList.add('selected');

            } else {
                titleInput.value = '';
                bodyInput.value = '';
                deleteBtn.style.display = 'none';
                document.querySelector('.color-dot[data-value="default"]').classList.add('selected');
            }

            modal.classList.add('open');
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.remove('open');
            // Hide keyboard on mobile
            document.activeElement.blur();
        }

        function selectColor(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        }

        // --- Navigation & Filter ---

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Update Title
            const titles = { 'all': 'My Notes', 'favorites': 'Favorites', 'work': 'Work', 'personal': 'Personal' };
            document.getElementById('pageTitle').innerText = titles[tab];
            
            renderNotes();
        }

        function filterNotes() {
            renderNotes();
        }

        // --- Utilities ---

        function saveToStorage() {
            localStorage.setItem('velvet_notes', JSON.stringify(notes));
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
        }

        // --- Theme System ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('velvet_theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            if (localStorage.getItem('velvet_theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
        }

    </script>
</body>
</html>
